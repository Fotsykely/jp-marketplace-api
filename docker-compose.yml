services:
  db:
    image: postgres:17
    container_name: okazy-db
    environment:
      POSTGRES_DB: okazy
      POSTGRES_USER: okazy
      POSTGRES_PASSWORD: okazy
    ports:
      - "5432:5432"
    volumes:
      - okazy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okazy"]
      interval: 5s
      retries: 10

volumes:
  okazy-pgdata:
